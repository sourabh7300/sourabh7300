<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Sourabh Singh — one file, one product, every one of them live">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset=".55" stop-color="#0a0b18"/>
      <stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6ff"/>
      <stop offset=".42" stop-color="#b9c2ff"/>
      <stop offset=".72" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0abfc" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#ffffff" fill-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#dots)"/>
  <ellipse cx="205" cy="40" rx="300" ry="170" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1010" cy="320" rx="300" ry="180" fill="url(#glowB)" filter="url(#soft)"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="18" fill="none" stroke="#1d2033"/>

  <text x="62" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="5.5" fill="#8b90a8">JAIPUR · INDIA</text>
  <text x="58" y="188" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#ink)">SOURABH SINGH</text>
  <text x="62" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#c9cde0">one file · one product · every one of them live</text>
  <rect x="62" y="252" width="420" height="2" rx="1" fill="url(#rule)"/>
  <text x="62" y="290" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#7f849c">B.Tech CSE — AI, DevOps &amp; Cloud Automation</text>
  <text x="62" y="314" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#7f849c">JECRC University, Jaipur</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="770" y="74" width="368" height="52" rx="14" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/>
    <circle cx="800" cy="100" r="5" fill="#a78bfa"/>
    <text x="818" y="106" font-size="17" font-weight="600" fill="#e9e5ff">AURA</text>
    <text x="884" y="106" font-size="14" fill="#a5a8c0">holographic AI assistant</text>

    <rect x="770" y="138" width="368" height="52" rx="14" fill="#ffb347" fill-opacity=".1" stroke="#ffb347" stroke-opacity=".42"/>
    <circle cx="800" cy="164" r="5" fill="#ffb347"/>
    <text x="818" y="170" font-size="17" font-weight="600" fill="#ffeedd">LUCID</text>
    <text x="884" y="170" font-size="14" fill="#a5a8c0">photo studio, GPU in the tab</text>

    <rect x="770" y="202" width="368" height="52" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/>
    <circle cx="800" cy="228" r="5" fill="#34d399"/>
    <text x="818" y="234" font-size="17" font-weight="600" fill="#dcfce9">IDEAVEDA</text>
    <text x="920" y="234" font-size="14" fill="#a5a8c0">startup decision engine</text>

    <text x="770" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#71718a" letter-spacing="1.5">NO FRAMEWORKS · NO BUILD STEP</text>
  </g>
</svg>
